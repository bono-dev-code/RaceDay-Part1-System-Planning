name: Build and Test Part 2

on:
  push:
    branches:
      - main
      - master
      - part2-api
    paths:
      - "part2/**"
      - "RaceDay.sln"
      - "README.md"
      - ".github/workflows/validate-part2.yml"

  pull_request:
    branches:
      - main
      - master
    paths:
      - "part2/**"
      - "RaceDay.sln"
      - "README.md"
      - ".github/workflows/validate-part2.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test RaceDay API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Confirm Part 2 repository structure
        shell: bash
        run: |
          test -f "part2/RaceDay.Api/RaceDay.Api.csproj"
          test -f "part2/RaceDay.Api/Program.cs"
          test -f "part2/RaceDay.Api/Data/RaceDayDbContext.cs"
          test -d "part2/RaceDay.Api/Controllers"
          test -f "part2/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj"
          test -f "part2/RaceDay.Api.Tests/ApiIntegrationTests.cs"
          test -f "README.md"
          echo "Part 2 repository structure is valid."

      - name: Restore Part 2 dependencies
        run: dotnet restore part2/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build Part 2 projects
        run: >
          dotnet build
          part2/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run Part 2 automated tests
        run: >
          dotnet test
          part2/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal