name: Build and Test Part 2

on:
  push:
    branches: ["main", "master", "part2-api"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore RaceDay.sln
      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Run unit and integration tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
      - name: Confirm Part 2 structure
        shell: bash
        run: |
          test -f Part2/RaceDay.Api/Program.cs
          test -f Part2/RaceDay.Api/Data/RaceDayDbContext.cs
          test -d Part2/RaceDay.Api/Controllers
          test -f Part2/RaceDay.Api.Tests/ApiIntegrationTests.cs
          test -f README.md
